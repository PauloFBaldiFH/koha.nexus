# The panel's Platforms screen (panel/kei_panel/views/platforms.py) and
# Tainacan's section (views/tainacan.py) against the installer's tasks:
# Docker, Tainacan, the platform backups and the optional events in
# Tainacan (buttons, what each one shows, the plan and the Yes before
# anything, cancelling, the installer's failure messages), the
# administrative access and the steps after a new installation, and the sidebar
# and the dashboard's tabs on four servers (no platform, Koha only,
# Tainacan only, both). The panel runs in its demo mode; the installer is
# only read.
name: Platforms panel

on:
  push:
    paths:
      - "installer"
      - "lang/pt.cache"
      - "panel/kei_panel/**"
      - "panel/tests/test_platforms.py"
      - "panel/tests/test_dspace_panel.py"
      - "panel/tests/test_tainacan_view.py"
      - "panel/tests/test_dashboard.py"
      - "panel/tests/test_backup_center.py"
      - "panel/tests/test_nexus_backup.py"
      - "panel/tests/test_schedules.py"
      - "panel/tests/test_schedule_controls.py"
      - "panel/tests/test_cron.py"
      - "panel/tests/test_cron_view.py"
      - "panel/tests/test_admin_setup.py"
      - "panel/tests/test_u1_texts.py"
      - "panel/tests/test_u2_backups.py"
      - "panel/tests/test_u3_install.py"
      - "panel/tests/test_u4_completion.py"
      - "panel/tests/test_u5_navigation.py"
      - "panel/tests/test_u5_languages.py"
      - "panel/tests/test_u5_addresses.py"
      - "panel/tests/test_u6_names.py"
      - "panel/tests/test_u7_summary.py"
      - "nexus_core/instances.py"
      - "platforms/dspace/runtime.py"
      - "panel/tests/test_tainacan_free.py"
      - "panel/tests/conftest.py"
      - "panel/requirements.txt"
      - ".github/workflows/platforms-panel.yml"
  pull_request:
    paths:
      - "installer"
      - "lang/pt.cache"
      - "panel/kei_panel/**"
      - "panel/tests/test_platforms.py"
      - "panel/tests/test_dspace_panel.py"
      - "panel/tests/test_tainacan_view.py"
      - "panel/tests/test_dashboard.py"
      - "panel/tests/test_backup_center.py"
      - "panel/tests/test_nexus_backup.py"
      - "panel/tests/test_schedules.py"
      - "panel/tests/test_schedule_controls.py"
      - "panel/tests/test_cron.py"
      - "panel/tests/test_cron_view.py"
      - "panel/tests/test_admin_setup.py"
      - "panel/tests/test_u1_texts.py"
      - "panel/tests/test_u2_backups.py"
      - "panel/tests/test_u3_install.py"
      - "panel/tests/test_u4_completion.py"
      - "panel/tests/test_u5_navigation.py"
      - "panel/tests/test_u5_languages.py"
      - "panel/tests/test_u5_addresses.py"
      - "panel/tests/test_u6_names.py"
      - "panel/tests/test_u7_summary.py"
      - "nexus_core/instances.py"
      - "platforms/dspace/runtime.py"
      - "panel/tests/test_tainacan_free.py"
      - "panel/tests/conftest.py"
      - "panel/requirements.txt"
      - ".github/workflows/platforms-panel.yml"

permissions:
  contents: read

jobs:
  platforms:
    name: Python ${{ matrix.python }}
    # Python 3.9 needs a runner actions/setup-python still supports.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: panel/requirements.txt
      - run: python -m pip install pytest -r panel/requirements.txt
      - name: Platforms screen, Tainacan section, dashboard tabs, Backup center, schedules and admin access
        working-directory: panel
        run: python -m pytest -q tests/test_dspace_panel.py tests/test_platforms.py tests/test_tainacan_view.py tests/test_dashboard.py tests/test_backup_center.py tests/test_nexus_backup.py tests/test_schedules.py tests/test_schedule_controls.py tests/test_cron.py tests/test_cron_view.py tests/test_admin_setup.py tests/test_tainacan_free.py tests/test_u1_texts.py tests/test_u2_backups.py tests/test_u3_install.py tests/test_u4_completion.py tests/test_u5_navigation.py tests/test_u5_languages.py tests/test_u5_addresses.py tests/test_u6_names.py tests/test_u7_summary.py --junitxml="$RUNNER_TEMP/platforms-panel.xml"
      - name: Identify failing tests without exposing full diagnostic logs
        if: always()
        run: |
          python - <<'PYREPORT'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'platforms-panel.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      name = case.get('classname', '') + '.' + case.get('name', '')
                      name = name.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Panel regression::' + name)
          PYREPORT
