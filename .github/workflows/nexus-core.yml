# nexus_core: the shared Python core (status, state, alerts) of the desktop
# clients. Pure unit tests plus one contract test that runs this
# repository's installer with --status-json and parses what it prints.
name: nexus_core

on:
  push:
    paths:
      - "nexus_core/**"
      - "installer"
      - "panel/kei_panel/menus.py"
      - ".github/workflows/nexus-core.yml"
  pull_request:
    paths:
      - "nexus_core/**"
      - "installer"
      - "panel/kei_panel/menus.py"
      - ".github/workflows/nexus-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest nexus_core/tests -v
