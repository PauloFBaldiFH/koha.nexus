name: DSpace image foundation

on:
  pull_request:
    paths:
      - 'platforms/dspace/**'
      - 'tools/dspace_images.py'
      - 'tools/dspace_bootstrap.py'
      - 'tools/dspace_build_bundle.py'
      - 'tests/test_dspace_bootstrap.py'
      - 'tools/dspace_smoke.py'
      - 'tools/dspace_catalog.py'
      - 'tools/dspace_install_test.py'
      - 'tools/dspace_browser_test.py'
      - 'tools/dspace_recovery_test.py'
      - 'tests/test_dspace_backup.py'
      - 'tests/test_dspace_operations.py'
      - 'tools/dspace_operations_test.py'
      - 'tools/dspace_upgrade_test.py'
      - 'tests/test_dspace_browser_support.py'
      - 'tests/test_dspace_runtime.py'
      - 'tests/test_dspace_web.py'
      - 'tests/java/NexusSchemaGuardTest.java'
      - 'installer'
      - 'tests/test_dspace_images.py'
      - '.github/workflows/dspace-images.yml'
  push:
    branches: [main, 'feat/dspace-*']
    paths:
      - 'platforms/dspace/**'
      - 'tools/dspace_images.py'
      - 'tools/dspace_bootstrap.py'
      - 'tools/dspace_build_bundle.py'
      - 'tests/test_dspace_bootstrap.py'
      - 'tools/dspace_smoke.py'
      - 'tools/dspace_catalog.py'
      - 'tools/dspace_install_test.py'
      - 'tools/dspace_browser_test.py'
      - 'tools/dspace_recovery_test.py'
      - 'tests/test_dspace_backup.py'
      - 'tests/test_dspace_operations.py'
      - 'tools/dspace_operations_test.py'
      - 'tools/dspace_upgrade_test.py'
      - 'tests/test_dspace_browser_support.py'
      - 'tests/test_dspace_runtime.py'
      - 'tests/test_dspace_web.py'
      - 'tests/java/NexusSchemaGuardTest.java'
      - 'installer'
      - 'tests/test_dspace_images.py'
      - '.github/workflows/dspace-images.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish tested experimental images to GHCR (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dspace-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test schema guard without loading DSpace/Flyway
        run: |
          mkdir -p "$RUNNER_TEMP/schema-guard"
          javac -d "$RUNNER_TEMP/schema-guard" platforms/dspace/images/NexusSchemaGuard.java tests/java/NexusSchemaGuardTest.java
          java -cp "$RUNNER_TEMP/schema-guard" NexusSchemaGuardTest
      - run: python tools/dspace_images.py validate
      - run: python tools/dspace_build_bundle.py --check
      - run: python -m unittest discover -s tests -p test_dspace_bootstrap.py -v
      - run: python -m unittest discover -s tests -p test_dspace_images.py -v
      - run: python -m unittest discover -s tests -p test_dspace_runtime.py -v
      - run: python -m unittest discover -s tests -p test_dspace_backup.py -v
      - run: python -m unittest discover -s tests -p test_dspace_operations.py -v
      - run: sudo $(which python) -m unittest discover -s tests -p test_dspace_web.py -v
      - run: python -m unittest discover -s tests -p test_dspace_browser_support.py -v
      - run: bash -n installer
      - name: Validate runtime shell scripts
        run: |
          sh -n platforms/dspace/images/backend-entrypoint.sh
          sh -n platforms/dspace/images/ui-entrypoint.sh
          bash -n platforms/dspace/images/solr-entrypoint.sh

  images:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [backend, ui, solr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Restore identical release image archive when available
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dspace-${{ matrix.image }}.tar.gz
          key: dspace-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.image }}-${{ hashFiles('platforms/dspace/release.json', 'platforms/dspace/ui-dependencies.json', 'platforms/dspace/images/**', 'tools/dspace_images.py', 'LICENSE') }}
      - name: Load cached immutable image (smoke and integrated tests still run)
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/dspace-${{ matrix.image }}.tar.gz"
      - name: Fetch and verify released upstream sources
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: python tools/dspace_images.py prepare "$RUNNER_TEMP/dspace-sources"
      - name: Build locked image without registry publication
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: >-
          python tools/dspace_images.py build "$RUNNER_TEMP/dspace-sources"
          --image '${{ matrix.image }}'
          --metadata "$RUNNER_TEMP/dspace-results/${{ matrix.image }}.json"
      - name: Runtime smoke test (not repository acceptance)
        run: python tools/dspace_smoke.py '${{ matrix.image }}'
      - name: Export tested image for integrated acceptance
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          docker save "$(python tools/dspace_images.py tag '${{ matrix.image }}')" | gzip -1 > "$RUNNER_TEMP/dspace-${{ matrix.image }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dspace-${{ matrix.image }}-runtime
          path: ${{ runner.temp }}/dspace-${{ matrix.image }}.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Record resolved local image and inputs
        id: record
        if: success()
        env:
          CACHE_RESTORED: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/dspace-results"
          cp platforms/dspace/release.json "$RUNNER_TEMP/dspace-results/release.json"
          cp platforms/dspace/contract.json "$RUNNER_TEMP/dspace-results/contract.json"
          echo "tag=$(python tools/dspace_images.py tag '${{ matrix.image }}')" >> "$GITHUB_OUTPUT"
          docker image inspect "$(python tools/dspace_images.py tag '${{ matrix.image }}')" > "$RUNNER_TEMP/dspace-results/image.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {"validation_commit": os.environ["GITHUB_SHA"], "image_archive_restored": os.environ["CACHE_RESTORED"] == "true"}
          (Path(os.environ["RUNNER_TEMP"]) / "dspace-results" / "validation.json").write_text(json.dumps(record, indent=2))
          PY
      # Download separately so a transient GitHub 504 can be retried without
      # treating a failed SBOM scan as successful. Both actions use the same
      # version-keyed Actions tool cache.
      - name: Download inventory tool
        id: syft-download
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.42.3
      - name: Wait before retrying inventory tool download
        if: steps.syft-download.outcome == 'failure'
        run: sleep 30
      - name: Retry inventory tool download (required)
        if: steps.syft-download.outcome == 'failure'
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.42.3
      - name: Generate component inventory
        uses: anchore/sbom-action@v0
        with:
          syft-version: v1.42.3
          image: ${{ steps.record.outputs.tag }}
          artifact-name: dspace-${{ matrix.image }}-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspace-${{ matrix.image }}-build-record
          path: ${{ runner.temp }}/dspace-results/
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/dspace_images.py prepare "$RUNNER_TEMP/dspace-audit-sources"
      - name: Audit production dependency graph (blocks high/critical advisories)
        run: >-
          npm audit --package-lock-only --omit=dev --audit-level=high --json
          --prefix "$RUNNER_TEMP/dspace-audit-sources/ui-source"
          > "$RUNNER_TEMP/dspace-ui-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspace-ui-dependency-audit
          path: ${{ runner.temp }}/dspace-ui-audit.json
          if-no-files-found: ignore
          retention-days: 7

  legacy-images:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [backend, ui, solr]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: actions/cache@v4
        id: legacy-cache
        with:
          path: ${{ runner.temp }}/legacy-${{ matrix.image }}.tar.gz
          key: dspace-historical-r3-858153cc-${{ runner.os }}-${{ runner.arch }}-${{ matrix.image }}
      - name: Build actual recipe 3 from its pinned historical source export
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-recipe"
          git archive 858153cc730c17d410943836d222944149c24250 platforms/dspace tools/dspace_images.py LICENSE | tar -x -C "$RUNNER_TEMP/legacy-recipe"
          python "$RUNNER_TEMP/legacy-recipe/tools/dspace_images.py" prepare "$RUNNER_TEMP/legacy-sources"
          python "$RUNNER_TEMP/legacy-recipe/tools/dspace_images.py" build "$RUNNER_TEMP/legacy-sources" --image '${{ matrix.image }}' --metadata "$RUNNER_TEMP/legacy-${{ matrix.image }}.json"
          docker save "nexus-dspace-${{ matrix.image }}:10.1-r3" | gzip -1 > "$RUNNER_TEMP/legacy-${{ matrix.image }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-dspace-${{ matrix.image }}-runtime
          path: ${{ runner.temp }}/legacy-${{ matrix.image }}.tar.gz
          compression-level: 0
          retention-days: 1

  upgrade:
    needs: [images, legacy-images, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*dspace-*-runtime'
          path: ${{ runner.temp }}/dspace-runtime
          merge-multiple: true
      - name: Load both independently built reviewed image matrices
        run: |
          for archive in "$RUNNER_TEMP"/dspace-runtime/*.tar.gz; do docker load -i "$archive"; done
      - name: Prepare disposable resource infrastructure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2 iptables iproute2 curl python3 gnupg restic rclone
          sudo systemctl start apache2
      - name: Resolve the canonical disposable repository address
        run: echo "127.0.0.1 repository.kei.test" | sudo tee -a /etc/hosts
      - name: Actual historical upgrade and rollback
        run: >-
          sudo env RUNNER_TEMP="$RUNNER_TEMP"
          KEI_DOCKER_ISOLATION_CMD="/bin/bash $GITHUB_WORKSPACE/installer --task docker-isolation"
          python3 tools/dspace_upgrade_test.py --disposable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspace-reviewed-upgrade
          path: ${{ runner.temp }}/dspace-upgrade-acceptance.json
          if-no-files-found: ignore

  installation:
    needs: [images, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dspace-*-runtime
          path: ${{ runner.temp }}/dspace-runtime
          merge-multiple: true
      - name: Load the exact images that passed their smoke tests
        run: |
          for archive in "$RUNNER_TEMP"/dspace-runtime/*.tar.gz; do docker load -i "$archive"; done
      - name: Existing resource infrastructure on a disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2 iptables iproute2 curl python3 python3-venv gnupg restic rclone cron openssl
          sudo systemctl start apache2
      - name: Prepare real browser acceptance
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/dspace-browsers"
          python3 -m venv "$RUNNER_TEMP/dspace-browser"
          "$RUNNER_TEMP/dspace-browser/bin/pip" install 'playwright>=1.56,<2'
          "$RUNNER_TEMP/dspace-browser/bin/python" -m playwright install --with-deps chromium
      - name: Resolve the canonical disposable repository address
        run: echo "127.0.0.1 repository.kei.test" | sudo tee -a /etc/hosts
      - name: Real integrated lifecycle (no VM reboot claim)
        run: >-
          sudo env RUNNER_TEMP="$RUNNER_TEMP" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/dspace-browsers"
          KEI_DOCKER_ISOLATION_CMD="/bin/bash $GITHUB_WORKSPACE/installer --task docker-isolation"
          "$RUNNER_TEMP/dspace-browser/bin/python" tools/dspace_install_test.py --disposable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspace-integrated-acceptance
          path: |
            ${{ runner.temp }}/dspace-acceptance.json
            ${{ runner.temp }}/dspace-operations-acceptance.json
            ${{ runner.temp }}/dspace-recovery-acceptance.json
            ${{ runner.temp }}/dspace-browser-acceptance.json
            ${{ runner.temp }}/dspace-public-item.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # A PR/push never publishes packages. Publication is a separate explicit action.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [installation, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dspace-*-runtime
          path: ${{ runner.temp }}/dspace-runtime
          merge-multiple: true
      - name: Load tested images
        run: |
          for archive in "$RUNNER_TEMP"/dspace-runtime/*.tar.gz; do docker load -i "$archive"; done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image identities and generate candidate catalog
        run: |
          set -e
          for image in backend ui solr; do
            tag=$(python3 tools/dspace_images.py tag "$image")
            target="ghcr.io/paulofbaldifh/koha.nexus/dspace-$image:${GITHUB_SHA}"
            docker tag "$tag" "$target"
            docker push "$target"
            docker pull "$target"
          done
          python3 tools/dspace_catalog.py --published > "$RUNNER_TEMP/dspace-images.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dspace-candidate-published-catalog
          path: ${{ runner.temp }}/dspace-images.json
          retention-days: 30
