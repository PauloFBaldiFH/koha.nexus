# The SRU services on main: catalog-network/ (the shared catalogue); the
# sru-bridge/ services now live on their own backup branch. Unit tests only;
# they never reach the remote catalogues (fakes and saved pages stand in).
name: sru-services

on:
  push:
    paths:
      - "catalog-network/**"
      - ".github/workflows/sru-services.yml"
  pull_request:
    paths:
      - "catalog-network/**"
      - ".github/workflows/sru-services.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-network]
        # Debian 12's Python and Debian 13's.
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -v
