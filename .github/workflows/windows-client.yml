# windows/client: the Python tray and status window for Windows (Phase 1).
# - tests: the pure unit tests (nexus_core and the client) on Linux, and the
#   check that runtime.lock.json still matches PyPI and python.org;
# - runtime: on a real Windows runner, KohaEasy.Python.psm1 installs the
#   embeddable Python and the locked wheels into a scratch bin folder, then
#   imports the tray and the window with that Python and runs the Control
#   Center smoke test: one process with the window (WebView2) and the tray
#   icon, the sidebar drawn from panel/kei_panel/menus.py and one task's
#   events carried to the page.
# Nothing here touches the Linux installer or the panel.
name: windows-client

on:
  push:
    paths:
      - "panel/kei_panel/menus.py"
      - "windows/client/**"
      - "windows/KohaEasy.Python.psm1"
      - "windows/KohaEasy.Install.psm1"
      - "windows/install.ps1"
      - "nexus_core/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    paths:
      - "panel/kei_panel/menus.py"
      - "windows/client/**"
      - "windows/KohaEasy.Python.psm1"
      - "windows/KohaEasy.Install.psm1"
      - "windows/install.ps1"
      - "nexus_core/**"
      - ".github/workflows/windows-client.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest nexus_core/tests windows/client/tests -v
      - name: runtime.lock.json matches upstream
        run: python windows/client/tools/lock_runtime.py --check

  client-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest nexus_core/tests windows/client/tests -v

  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the embeddable Python from runtime.lock.json
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'Koha\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item -LiteralPath 'windows\client' -Destination $bin -Recurse
          Copy-Item -LiteralPath 'nexus_core' -Destination $bin -Recurse
          Copy-Item -LiteralPath 'panel' -Destination $bin -Recurse
          Copy-Item -LiteralPath 'lang' -Destination $bin -Recurse
          Copy-Item -LiteralPath 'windows\koha.ico' -Destination $bin
          Import-Module (Resolve-Path 'windows\KohaEasy.Python.psm1')
          $cache = Join-Path $env:RUNNER_TEMP 'Koha\downloads\python'
          $dir = Install-KohaPythonRuntime -Bin $bin -Cache $cache
          $check = Test-KohaPythonRuntime -PythonDir $dir
          Write-Host "import check: $check"
          if ($check -ne 'ok') { throw "the tray does not load: $check" }
          & (Join-Path $dir 'python.exe') -m koha_nexus_win version
          if ($LASTEXITCODE -ne 0) { throw 'koha_nexus_win version failed' }
          # A second run with everything cached must also work.
          $dir = Install-KohaPythonRuntime -Bin $bin -Cache $cache
          if ((Test-KohaPythonRuntime -PythonDir $dir) -ne 'ok') { throw 'second install failed' }
      - name: Control Center smoke test (window + tray icon in one process)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:KOHAEASY_ROOT = Join-Path $env:RUNNER_TEMP 'Koha'
          $python = Join-Path $env:RUNNER_TEMP 'Koha\bin\python\python.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath $python -ArgumentList '-m', 'koha_nexus_win', 'app', '--smoke', $out -PassThru -NoNewWindow
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'the Control Center did not quit within 4 minutes' }
          Get-ChildItem (Join-Path $env:KOHAEASY_ROOT 'logs') -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Tail 60 }
          if (-not (Test-Path -LiteralPath $out)) { throw 'no smoke report was written' }
          $report = Get-Content -LiteralPath $out -Raw
          Write-Host $report
          if (-not ($report | ConvertFrom-Json).ok) { throw 'the Control Center smoke test failed' }
