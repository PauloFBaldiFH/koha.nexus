# Tainacan from end to end, with real WordPress, the real Tainacan plugin
# and a real browser (tests/e2e/tainacan_e2e.sh): install through the
# panel's tasks, log in, create a collection and an item with an image,
# find them without a login, keep private content private, survive a
# Docker restart and a reboot, back up and restore in isolation. The
# screenshots are kept as an artifact and, outside pull requests, also
# committed to the claude/project-thread-evltj0-evidence branch (only
# PNG files and the read-only probe's facts, never a password) so they can
# be reviewed without downloading the artifact.
name: Tainacan end to end

on:
  workflow_dispatch:
  push:
    paths:
      - "installer"
      - "tests/e2e/**"
      - "tests/system/container.sh"
      - "tests/system/apt-ready.sh"
      - ".github/workflows/tainacan-e2e.yml"
  pull_request:
    paths:
      - "installer"
      - "tests/e2e/**"
      - "tests/system/container.sh"
      - "tests/system/apt-ready.sh"
      - ".github/workflows/tainacan-e2e.yml"

permissions:
  contents: write

jobs:
  e2e:
    name: browser (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04"]
    env:
      KEI_REQUIRE_REAL_TAINACAN: "1"
      KEI_TAINACAN_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright and Chromium
        run: |
          sudo bash tests/system/apt-ready.sh
          python -m pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Install, use and recover Tainacan through the browser
        run: bash tests/e2e/tainacan_e2e.sh "${{ matrix.image }}" "$RUNNER_TEMP/e2e"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tainacan-e2e-${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
      - name: Publish the screenshots for review
        if: always() && github.event_name != 'pull_request'
        env:
          BRANCH: claude/project-thread-evltj0-evidence
          TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/e2e"
          [ -d "$src" ] || exit 0
          dir="$RUNNER_TEMP/evidence"
          rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin "$BRANCH"; then git checkout -q -b evidence FETCH_HEAD; else git checkout -q --orphan evidence; fi
          rm -rf tainacan-e2e && mkdir tainacan-e2e
          cp "$src"/*.png "$src"/probe-*.txt tainacan-e2e/ 2>/dev/null || true
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID}" > tainacan-e2e/RUN.txt
          git add -A tainacan-e2e
          git commit -q -m "Tainacan e2e screenshots, run ${GITHUB_RUN_ID}"
          git push -q origin "HEAD:refs/heads/${BRANCH}"
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-e2e
