# Tainacan from end to end, with real WordPress, the real Tainacan plugin
# and a real browser (tests/e2e/tainacan_e2e.sh): install through the
# panel's tasks, log in, create a collection and an item with an image,
# find them without a login, keep private content private, survive a
# Docker restart and a reboot, back up and restore in isolation. The
# screenshots are kept as an artifact and printed in the log.
name: Tainacan end to end

on:
  workflow_dispatch:
  push:
    paths:
      - "installer"
      - "tests/e2e/**"
      - "tests/system/container.sh"
      - ".github/workflows/tainacan-e2e.yml"
  pull_request:
    paths:
      - "installer"
      - "tests/e2e/**"
      - "tests/system/container.sh"
      - ".github/workflows/tainacan-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    name: browser (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04"]
    env:
      KEI_REQUIRE_REAL_TAINACAN: "1"
      KEI_TAINACAN_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright and Chromium
        run: |
          python -m pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Install, use and recover Tainacan through the browser
        run: bash tests/e2e/tainacan_e2e.sh "${{ matrix.image }}" "$RUNNER_TEMP/e2e"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tainacan-e2e-${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-e2e
