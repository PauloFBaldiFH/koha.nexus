# Resource ownership, the web proxy and Docker (installer: kei_owned_*,
# kei_proxy_*, kei_tunnel_*, kei_docker_*; uninstall.sh). Everything that
# changes a machine runs in a throwaway container, never on the runner:
#   apache  Ubuntu 24.04, Debian 12 and 13 containers with a real Apache:
#           the registry, proxy and Docker unit tests, then uninstall.sh.
#   system  the same systems as a machine with systemd as PID 1, its own
#           firewall, UFW, cloudflared and WireGuard (the runner's kernel):
#           Apache reloaded by systemd, UFW active, cloudflared's own
#           validation (proxy_system.bats), and Docker installed from its
#           official repository with the isolation tests
#           (docker_isolation.bats).
#   tainacan  the same machines: Tainacan installed the way the panel does
#           it, with the real plugin from wordpress.org (mandatory here) and
#           the images from Docker Hub by digest; data, isolation,
#           persistence, backup, isolated restore test, restore, address,
#           uninstall (tainacan_system.bats), then a real reboot of the
#           machine between two phases (tainacan_reboot.bats).
#   engine  the same machines: the common backup engine of the platforms
#           with a real Tainacan (backup_engine_system.bats): crashes inside
#           and after the window without writes, resume, restic repositories
#           (local and through rclone), the encrypted configuration and the
#           recovery phrase, the recovery kit, the cloud copy, the joint
#           package, the schedule. Its unit tests (backup_engine.bats,
#           backup_set.bats, no Docker) run in apache, with
#           admin_access.bats (administrative access and the steps after
#           a new installation, no Docker; the real WordPress part is in
#           tainacan_system.bats) and tainacan_free.bats (the free
#           koha.nexus address of the collection, against a stand-in of
#           the address service).
#   koha-set  Debian 12 with a real Koha (koha-common from the official
#           repository) and a real Tainacan (koha_set_system.bats): the
#           joint package, the instance recreated with another key and
#           database password, Koha restored alone from the set, a staff
#           two-factor secret that opens again only after the key comes
#           back, nothing else of koha-conf.xml changed, an uploaded file
#           and a plugin back, Tainacan restored on its own; the scheduled
#           joint backup run once with both platforms.
#   events  the same machines: events for Tainacan (tainacan_events_system.bats)
#           with the real Tainacan and Events Manager from wordpress.org
#           (mandatory here): an Events Manager already in the site kept, the
#           event edit screen drawn whole with Tainacan active, passes,
#           attendance, certificates, backup with events off, restore with and
#           without the recovery phrase, an enable cut half way that goes on. Its unit tests (tainacan_events.bats:
#           the production package, the checksums, the plan, the redaction, and
#           the copy in nexus-events-plugin/bundled against wordpress.org) run
#           in apache.
name: proxy

on:
  push:
    paths:
      - "installer"
      - "platforms/nexus/**"
      - "tools/nexus_recovery_test.py"
      - "tests/test_nexus_recovery.py"
      - "uninstall.sh"
      - "tests/proxy.bats"
      - "tests/proxy_system.bats"
      - "tests/docker.bats"
      - "tests/docker_isolation.bats"
      - "tests/uninstall_registry.bats"
      - "tests/platforms.bats"
      - "tests/addresses.bats"
      - "tests/tainacan.bats"
      - "tests/tainacan_system.bats"
      - "tests/tainacan_reboot.bats"
      - "tests/backup_engine.bats"
      - "tests/backup_set.bats"
      - "tests/schedule_controls.bats"
      - "tests/dspace_web.bats"
      - "tests/admin_access.bats"
      - "tests/tainacan_free.bats"
      - "tests/dspace_free.bats"
      - "tests/lib/fake_broker.py"
      - "tests/backup_engine_system.bats"
      - "tests/koha_set_system.bats"
      - "tests/tainacan_events.bats"
      - "tests/tainacan_events_system.bats"
      - "tests/system/events-fixture.php"
      - "tools/nexus-eventos-package.py"
      - "nexus-events-plugin/**"
      - "tests/system/**"
      - ".github/workflows/proxy.yml"
  pull_request:
    paths:
      - "installer"
      - "platforms/nexus/**"
      - "tools/nexus_recovery_test.py"
      - "tests/test_nexus_recovery.py"
      - "uninstall.sh"
      - "tests/proxy.bats"
      - "tests/proxy_system.bats"
      - "tests/docker.bats"
      - "tests/docker_isolation.bats"
      - "tests/uninstall_registry.bats"
      - "tests/platforms.bats"
      - "tests/addresses.bats"
      - "tests/tainacan.bats"
      - "tests/tainacan_system.bats"
      - "tests/tainacan_reboot.bats"
      - "tests/backup_engine.bats"
      - "tests/backup_set.bats"
      - "tests/schedule_controls.bats"
      - "tests/dspace_web.bats"
      - "tests/admin_access.bats"
      - "tests/tainacan_free.bats"
      - "tests/dspace_free.bats"
      - "tests/lib/fake_broker.py"
      - "tests/backup_engine_system.bats"
      - "tests/koha_set_system.bats"
      - "tests/tainacan_events.bats"
      - "tests/tainacan_events_system.bats"
      - "tests/system/events-fixture.php"
      - "tools/nexus-eventos-package.py"
      - "nexus-events-plugin/**"
      - "tests/system/**"
      - ".github/workflows/proxy.yml"

permissions:
  contents: read

jobs:
  apache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - name: Apache, proxy, Docker and uninstall tests in a throwaway container
        run: |
          docker run --rm -v "$PWD":/src:ro -e KEI_DESTRUCTIVE_TESTS=1 -e DEBIAN_FRONTEND=noninteractive \
            "${{ matrix.image }}" bash -c '
              set -e
              bash /src/tests/system/apt-ready.sh
              apt-get install -y -qq apache2 bats curl openssl python3 iproute2 gnupg restic rclone >/dev/null
              restic version
              cd /src
              bats tests/platforms.bats tests/addresses.bats tests/proxy.bats tests/docker.bats tests/tainacan.bats
              bats tests/backup_engine.bats tests/backup_set.bats tests/schedule_controls.bats tests/dspace_web.bats tests/admin_access.bats tests/tainacan_free.bats tests/dspace_free.bats
              KEI_REQUIRE_REAL_EVENTS=1 bats tests/tainacan_events.bats
              bats tests/uninstall_registry.bats'

  system:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - name: A machine with systemd
        run: |
          # With the module, the VPN test must use real WireGuard (no fallback).
          if sudo modprobe wireguard; then
            echo "KEI_REQUIRE_WIREGUARD=1" >> "$GITHUB_ENV"
          else
            echo "no WireGuard module: the VPN test uses a plain link"
          fi
          tests/system/container.sh start "${{ matrix.image }}" kn-system
      - name: cloudflared (its own validation of the tunnel file)
        timeout-minutes: 10
        run: |
          # GitHub release downloads can return repeated 504 responses. Allow
          # a bounded recovery window; a failed download still fails this job.
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 30 \
            --connect-timeout 20 --max-time 90 --retry-max-time 480 \
            --remove-on-error -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          # Not /tmp: Debian 13 mounts a tmpfs over it.
          docker cp cloudflared.deb kn-system:/root/cloudflared.deb
          docker exec kn-system dpkg -i /root/cloudflared.deb
      - name: Apache with systemd, UFW active, cloudflared
        run: tests/system/container.sh run kn-system bats tests/proxy_system.bats
      - name: Docker installed with consent, isolation tests
        run: tests/system/container.sh run kn-system bats tests/docker_isolation.bats
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-system

  tainacan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    env:
      KEI_REQUIRE_REAL_TAINACAN: "1"
      KEI_TAINACAN_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - name: A machine with systemd
        run: tests/system/container.sh start "${{ matrix.image }}" kn-system
      - name: Tainacan, real plugin, Koha and third parties preserved
        run: tests/system/container.sh run kn-system bats tests/tainacan_system.bats
      - name: Before the reboot
        run: KEI_REBOOT_PHASE=before tests/system/container.sh run kn-system bats tests/tainacan_reboot.bats
      - name: Reboot
        run: tests/system/container.sh reboot kn-system
      - name: After the reboot
        run: KEI_REBOOT_PHASE=after tests/system/container.sh run kn-system bats tests/tainacan_reboot.bats
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-system

  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    env:
      KEI_REQUIRE_REAL_TAINACAN: "1"
      KEI_TAINACAN_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - name: A machine with systemd
        run: tests/system/container.sh start "${{ matrix.image }}" kn-system
      - name: Backup engine with a real Tainacan; Koha and third parties preserved
        run: tests/system/container.sh run kn-system bats tests/backup_engine_system.bats
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-system

  koha-set:
    # Debian 12: the system the official Koha packages are built for.
    runs-on: ubuntu-latest
    # A run takes about ten minutes; a hang must not hold a runner for hours.
    timeout-minutes: 45
    env:
      KEI_REQUIRE_REAL_TAINACAN: "1"
      KEI_REQUIRE_REAL_KOHA: "1"
      KEI_TAINACAN_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - name: A machine with systemd
        run: tests/system/container.sh start debian:12 kn-system
      - name: Joint package with a real Koha and a real Tainacan; Koha's key recovered without overwriting the target
        run: tests/system/container.sh run kn-system bats tests/koha_set_system.bats
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-system

  events:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    env:
      KEI_REQUIRE_REAL_TAINACAN: "1"
      KEI_REQUIRE_REAL_EVENTS: "1"
      KEI_TAINACAN_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - name: A machine with systemd
        run: tests/system/container.sh start "${{ matrix.image }}" kn-system
      - name: Events with the real Tainacan and Events Manager; Koha and third parties preserved
        run: tests/system/container.sh run kn-system bats tests/tainacan_events_system.bats
      - name: Stop
        if: always()
        run: tests/system/container.sh stop kn-system
