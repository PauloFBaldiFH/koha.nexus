# Snippet for the OPAC virtual host (HTTPS, port 443). Enable proxy modules first:
#   sudo a2enmod proxy proxy_http headers && sudo systemctl reload apache2
# The bank must reach https://<opac>/nexus-pix/webhook; the browser calls /nexus-pix/charges same-origin.
ProxyPreserveHost On
ProxyPass        "/nexus-pix/" "http://127.0.0.1:8790/nexus-pix/" retry=0 timeout=30
ProxyPassReverse "/nexus-pix/" "http://127.0.0.1:8790/nexus-pix/"
RequestHeader unset X-Forwarded-For
