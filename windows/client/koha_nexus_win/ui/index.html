<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koha Nexus</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <img src="koha-logo.png" alt="koha.nexus" class="logo">
    <div id="head-state" class="head-state unknown"><span class="dot"></span><span id="head-state-text"></span></div>
    <div id="head-links" class="buttons"></div>
  </header>
  <nav id="sidebar" class="sidebar" aria-label="Sections">
    <ul id="nav"></ul>
    <button id="terminal-panel" class="nav-foot" type="button"></button>
  </nav>
  <main id="workspace" class="workspace">
    <section id="view-dashboard" class="view">
      <section id="banner" class="card banner unknown" aria-live="polite">
        <span class="dot"></span>
        <div class="banner-text">
          <div id="banner-title" class="banner-title">&hellip;</div>
          <div id="banner-sub" class="muted small"></div>
        </div>
      </section>
      <section class="card">
        <h2 id="cap-quick" class="caption"></h2>
        <div id="links" class="buttons"></div>
      </section>
      <section class="card">
        <h2 id="cap-components" class="caption"></h2>
        <ul id="components" class="rows"></ul>
      </section>
      <section class="card">
        <h2 id="cap-actions" class="caption"></h2>
        <div id="actions" class="buttons"></div>
      </section>
    </section>
    <section id="view-section" class="view" hidden>
      <h1 id="section-title" class="section-title"></h1>
      <div id="cards" class="cards"></div>
    </section>
  </main>
  <section id="job" class="job" hidden aria-live="polite">
    <div class="job-head">
      <div>
        <div id="job-title" class="job-title"></div>
        <div id="job-stage" class="muted small"></div>
      </div>
      <div class="buttons">
        <button id="job-log-toggle" type="button"></button>
        <button id="job-cancel" type="button"></button>
        <button id="job-close" type="button" hidden></button>
      </div>
    </div>
    <div id="job-bar" class="bar indeterminate"><span></span></div>
    <ul id="job-steps" class="steps"></ul>
    <div id="job-messages"></div>
    <div id="job-results"></div>
    <pre id="job-log" class="log" hidden></pre>
  </section>
</div>
<div id="dialog-veil" class="veil" hidden>
  <form id="dialog" class="dialog" role="dialog" aria-modal="true">
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <div id="dialog-body"></div>
    <div id="dialog-buttons" class="buttons end"></div>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
