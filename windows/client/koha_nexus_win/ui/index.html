<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koha</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="head">
  <img src="koha-logo.png" alt="koha.nexus" class="logo">
</header>
<main>
  <section id="banner" class="card banner unknown" aria-live="polite">
    <span class="dot"></span>
    <div class="banner-text">
      <div id="banner-title" class="banner-title">&hellip;</div>
      <div id="banner-sub" class="muted small"></div>
    </div>
  </section>
  <section class="card">
    <h2 id="cap-quick" class="caption"></h2>
    <div id="links" class="buttons"></div>
  </section>
  <section class="card">
    <h2 id="cap-components" class="caption"></h2>
    <ul id="components" class="rows"></ul>
  </section>
  <section class="card">
    <h2 id="cap-actions" class="caption"></h2>
    <div id="actions" class="buttons"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
